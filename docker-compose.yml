services:
  postgres:
    image: postgres:16-alpine
    container_name: fwp-postgres
    environment:
      POSTGRES_USER: fwp_user
      POSTGRES_PASSWORD: fwp_password
      POSTGRES_DB: fwp_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fwp_user -d fwp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fwp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend and frontend services will be added during implementation phase
  # api:
  #   build:
  #     context: .
  #     dockerfile: infra/docker/backend.Dockerfile
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:
